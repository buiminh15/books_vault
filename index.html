<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện Sách Tóm Tắt Cá Nhân</title>
  <script src="books_data.js"></script>
  <style>
    :root {
      --bg: #0b1120; --card: #151f32; --card-hover: #1e293b;
      --border: #27354f; --text: #f1f5f9; --muted: #94a3b8;
      --gold: #f59e0b; --blue: #3b82f6; --green: #10b981;
    }
    [data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --card-hover: #f1f5f9;
      --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px 20px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
    h1 { font-size: 1.8rem; color: var(--gold); display: flex; align-items: center; gap: 10px; }
    
    .toolbar { display: flex; gap: 14px; margin-bottom: 25px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 250px; }
    .search-box input { width: 100%; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-size: 0.95rem; }
    .search-box input:focus { border-color: var(--blue); }
    
    .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .pill.active, .pill:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .book-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; transition: 0.25s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .book-card:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: rgba(245,158,11,0.15); color: var(--gold); margin-bottom: 12px; }
    .book-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .btn-read { display: inline-block; text-align: center; background: var(--blue); color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 600; margin-top: 18px; transition: 0.2s; }
    .btn-read:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Digital Book Vault</h1>
      <button id="theme-btn" style="padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;">🌓 Đổi giao diện</button>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tên sách, chủ đề...">
      </div>
      <div class="filter-pills" id="category-pills">
        <button class="pill active" data-category="ALL">Tất cả</button>
        <button class="pill" data-category="Đầu tư & Trading">Đầu tư & Trading</button>
        <button class="pill" data-category="Tâm lý & Tư duy">Tâm lý & Tư duy</button>
        <button class="pill" data-category="Phát triển bản thân">Phát triển bản thân</button>
      </div>
    </div>

    <div class="book-grid" id="book-list"></div>
  </div>

  <script>
    // Dữ liệu mẫu dự phòng nếu chưa chạy script
    const data = typeof BOOKS_DATA !== 'undefined' ? BOOKS_DATA : [
      { title: "Mindset Secrets for Winning", filename: "books/mindset-secrets.html", category: "Tâm lý & Tư duy" },
      { title: "Wyckoff 2.0: Structures, Volume Profile and Order Flow", filename: "books/wyckoff-2-0.html", category: "Đầu tư & Trading" },
      { title: "Investing with Volume Analysis", filename: "books/volume-analysis.html", category: "Đầu tư & Trading" }
    ];

    const bookList = document.getElementById('book-list');
    const searchInput = document.getElementById('search-input');
    const pills = document.querySelectorAll('.pill');

    let currentCategory = 'ALL';
    let currentSearch = '';

    function renderBooks() {
      bookList.innerHTML = '';
      const filtered = data.filter(b => {
        const matchCategory = currentCategory === 'ALL' || b.category === currentCategory;
        const matchSearch = b.title.toLowerCase().includes(currentSearch.toLowerCase());
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        bookList.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1; text-align: center; padding: 40px;">Không tìm thấy cuốn sách nào phù hợp.</p>';
        return;
      }

      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div>
            <span class="tag">${b.category}</span>
            <h2 class="book-title">${b.title}</h2>
          </div>
          <a href="${b.filename}" class="btn-read" target="_blank">📖 Đọc Tóm Tắt</a>
        `;
        bookList.appendChild(card);
      });
    }

    // Xử lý Search
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderBooks();
    });

    // Xử lý Filter Tab
    pills.forEach(p => {
      p.addEventListener('click', () => {
        pills.forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        currentCategory = p.dataset.category;
        renderBooks();
      });
    });

    // Toggle Sáng/Tối
    document.getElementById('theme-btn').addEventListener('click', () => {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    renderBooks();
  </script>
</body>
</html>
